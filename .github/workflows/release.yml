name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tools/package_skills.py --out dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.skill
          generate_release_notes: true
